  <title><?=$title?></title>
  <!-- 第三方依赖：由 vite-plugin-xq-cp-dep 拷贝到 public 后引用。
       内联脚本按当前路径动态注入相对路径（/doc/ 页自动用 ../bootstrap/...），
       让插件产物被真正使用且兼容 file:// 与导出 PDF。 -->
  <script>
    (function () {
      var depth = (location.pathname.indexOf('/doc/') >= 0) ? '../' : '';
      var head = document.head;
      ['bootstrap/dist/css/bootstrap.min.css', 'bootstrap-icons/font/bootstrap-icons.css'].forEach(function (u) {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = depth + u;
        head.appendChild(l);
      });
      var s = document.createElement('script');
      s.src = depth + 'bootstrap/dist/js/bootstrap.bundle.min.js';
      head.appendChild(s);
    })();
  </script>
</head>
