            <div class="section-card bg-white">
                <div class="section-header bg-secondary text-white">
                    <span>
                        <a href="index.html" class="text-white text-decoration-none">主页</a>

                <div class="section-body">
                    <p class="ticket-desc text-body">
                        为了保障账号安全，请定期修改密码。新密码至少 8 位，建议包含字母与数字组合。
                    </p>

                    <form class="mt-3">
                        <!-- 原密码 -->
                        <div class="mb-3">
                            <label class="form-label-custom text-body">原密码：</label>
                            <input type="password" class="form-control" placeholder="请输入原密码">
                        </div>

                        <!-- 新密码 -->
                        <div class="mb-3">
                            <label class="form-label-custom text-body">新密码：</label>
                            <input type="password" class="form-control" placeholder="至少8位，建议字母与数字组合">
                        </div>

                        <!-- 确认新密码 -->
                        <div class="mb-3">
                            <label class="form-label-custom text-body">确认密码：</label>
                            <input type="password" class="form-control" placeholder="请再次输入新密码">
                        </div>

                        <!-- 提交 -->
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary px-5">确认修改</button>
                        </div>
                    </form>
                </div>
