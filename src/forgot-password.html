<xq-include file="/partials/doc-start.html" title="忘记密码 - 新齐程序实践" docClass=''></xq-include>


        <!-- 内容区 -->
        <div class="content-area">
            <div class="main-content">
                <div class="section-card bg-white">
                    <div class="section-header bg-secondary text-white">
                        <span><i class="bi bi-key me-1"></i>找回密码</span>
                    </div>
                    <div class="section-body">
                        <div class="auth-form-wrapper">
                            <p class="ticket-desc text-body">
                                请输入注册手机号，通过短信验证码验证身份后重置密码。
                            </p>

                            <form class="mt-3">
                                <!-- 手机号 -->
                                <div class="mb-3">
                                    <label class="form-label text-body">手机号</label>
                                    <input type="tel" class="form-control" placeholder="请输入注册手机号">
                                </div>

                                <!-- 验证码 -->
                                <div class="mb-3">
                                    <label class="form-label text-body">验证码</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" placeholder="请输入验证码">
                                        <button class="btn btn-outline-secondary" type="button">获取验证码</button>
                                    </div>
                                </div>

                                <!-- 新密码 -->
                                <div class="mb-3">
                                    <label class="form-label text-body">新密码</label>
                                    <input type="password" class="form-control" placeholder="至少8位，建议字母与数字组合">
                                </div>

                                <!-- 确认新密码 -->
                                <div class="mb-3">
                                    <label class="form-label text-body">确认新密码</label>
                                    <input type="password" class="form-control" placeholder="请再次输入新密码">
                                </div>

                                <!-- 提交按钮 -->
                                <button type="submit" class="btn btn-primary btn-submit">确认重置</button>

                                <!-- 底部互链 -->
                                <div class="auth-links">
                                    想起密码了？<a href="login.html">返回登录</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="sidebar">
                <div class="sidebar-card">
                    <div class="sidebar-header">快速操作</div>
                    <div class="sidebar-body">
                        <a href="login.html" class="quick-link"><i class="bi bi-box-arrow-in-right"></i>用户登录</a>
                        <a href="register.html" class="quick-link"><i class="bi bi-person-plus"></i>注册账号</a>
                        <a href="index.html" class="quick-link"><i class="bi bi-house"></i>返回首页</a>
                    </div>
                </div>
                <div class="sidebar-card">
                    <div class="sidebar-header">帮助提示</div>
                    <div class="sidebar-body">
                        <ul>
                            <li><a href="login.html">想起密码了？<span class="sidebar-date">登录</span></a></li>
                            <li><a href="register.html">还没有账号？<span class="sidebar-date">注册</span></a></li>
                        </ul>
                    </div>
                </div>
            </div>
            <!-- 底部版权 -->
